[build]
  publish = "dist"
  command = "npm run build"

# ─────────────────────────────────────────
# NO redirects.
# All routes are prerendered as dist/<route>/index.html.
# Netlify auto-resolves directory-index files (/<route>/ → /<route>/index.html).
# For unknown paths, Netlify auto-serves dist/404.html (also prerendered, noindex).
# A catch-all SPA fallback would risk intercepting valid routes, so we omit it.
# ─────────────────────────────────────────

# Long-term caching for hashed Vite assets and project images
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
