[build]
  publish = "dist"
  command = "npm run build"

# ─────────────────────────────────────────
# Redirects
# We use a directory-index file structure (dist/servicii/index.html →
# /servicii/) so Netlify serves trailing-slash URLs natively. Canonical
# tags and sitemap entries match. The only redirect is the SPA fallback
# for unknown routes (NotFound component carries its own noindex meta).
# ─────────────────────────────────────────

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ─────────────────────────────────────────
# Long-term caching for hashed Vite assets and project images
# ─────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─────────────────────────────────────────
# Security headers
# ─────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
