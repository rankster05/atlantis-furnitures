<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#121212">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags - Default (overwritten per route via prerender) -->
    <title>Mobilier la Comanda Bucuresti | Atlantis Furnitures</title>
    <meta name="description" content="Producem mobilier la comanda din MDF si PAL pentru Bucuresti si Ilfov. Bucatarii, livinguri, dormitoare, dressing-uri, office. Cere oferta gratuita azi!">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="author" content="Atlantis Furnitures" />
    <link rel="canonical" href="https://atlantisfurnitures.ro/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Atlantis Furnitures">
    <meta property="og:locale" content="ro_RO">
    <meta property="og:url" content="https://atlantisfurnitures.ro/">
    <meta property="og:title" content="Mobilier la Comanda Bucuresti | Atlantis Furnitures">
    <meta property="og:description" content="Producem mobilier la comanda din MDF si PAL pentru Bucuresti si Ilfov. Bucatarii, livinguri, dormitoare, dressing-uri, office. Cere oferta gratuita azi!">
    <meta property="og:image" content="https://atlantisfurnitures.ro/projects/AP%20AIR-U/design-interior-apartament-modern-unirii-atlantis-furnitures.webp">
    <!-- Dimensions must match the file byte-for-byte, or Facebook/LinkedIn crop
         against the wrong box. prerender.mjs reads the real WebP header per
         route and rewrites this pair, so these are only the default. -->
    <meta property="og:image:width" content="1920">
    <meta property="og:image:height" content="1280">
    <meta property="og:image:alt" content="Mobilier la comanda - apartament modern Bucuresti">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Mobilier la Comanda Bucuresti | Atlantis Furnitures">
    <meta name="twitter:description" content="Producem mobilier la comanda din MDF si PAL pentru Bucuresti si Ilfov. Bucatarii, livinguri, dormitoare, dressing-uri, office. Cere oferta gratuita azi!">
    <meta name="twitter:image" content="https://atlantisfurnitures.ro/projects/AP%20AIR-U/design-interior-apartament-modern-unirii-atlantis-furnitures.webp">

    <!-- Performance: the homepage LCP is the hero poster image. Preload the
         same responsive pair the markup declares, so the fetch starts before
         the parser even reaches the element. The video is loaded later, on
         idle, and never competes with this. -->
    <link rel="preload" as="image" href="/projects/AP%20AIR-V/hero-poster.webp" fetchpriority="high">

    <!-- Fonts are self-hosted (see index.css @font-face). Preload only the two
         faces used above the fold — the rest stream in as needed. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/syncopate-400-latin.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/manrope-var-latin.woff2" crossorigin>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>

  <!-- ─────────────────────────────────────────────────────────────────────────
       Structured Data: the site-wide graph.

       These three nodes describe the *entity*, not the page, so they are
       identical on every URL and live here rather than being rebuilt per route.
       Page-level nodes (WebPage / CollectionPage / BreadcrumbList / FAQPage)
       are injected at runtime by components/SEO.tsx and point back here by @id.

       Service-area business: there is deliberately no `address`. The workshop
       address stays out of the markup so Google keeps using the hidden address
       configured in the Business Profile.
       ───────────────────────────────────────────────────────────────────────── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": ["HomeAndConstructionBusiness", "FurnitureStore"],
        "@id": "https://atlantisfurnitures.ro/#business",
        "name": "Atlantis Furnitures",

        "logo": {
          "@type": "ImageObject",
          "@id": "https://atlantisfurnitures.ro/#logo",
          "url": "https://atlantisfurnitures.ro/logo-atlantis-furnitures.png",
          "contentUrl": "https://atlantisfurnitures.ro/logo-atlantis-furnitures.png",
          "width": 512,
          "height": 512,
          "caption": "Atlantis Furnitures"
        },
        "url": "https://atlantisfurnitures.ro/",
        "telephone": "+40732717666",
        "priceRange": "$$$",
        "currenciesAccepted": "RON",
        "hasMap": "https://www.google.com/maps?cid=5080307166075099712",
        "areaServed": [
          { "@type": "City", "name": "Bucuresti" },
          { "@type": "AdministrativeArea", "name": "Ilfov" }
        ],
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "5.0",
          "reviewCount": 97,
          "bestRating": "5",
          "worstRating": "1"
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "08:00",
          "closes": "19:00"
        },
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "@id": "https://atlantisfurnitures.ro/#servicii",
          "name": "Servicii mobilier la comanda",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "@id": "https://atlantisfurnitures.ro/#serviciu-bucatarii",
                "name": "Bucatarii la comanda",
                "serviceType": "Bucatarii la comanda",
                "description": "Bucatarii personalizate din MDF vopsit sau furniruit, cu feronerie Blum si Hettich, proiectare 3D, executie in atelier propriu si montaj.",
                "provider": { "@id": "https://atlantisfurnitures.ro/#business" },
                "areaServed": [
                  { "@type": "City", "name": "Bucuresti" },
                  { "@type": "AdministrativeArea", "name": "Ilfov" }
                ]
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "@id": "https://atlantisfurnitures.ro/#serviciu-dressinguri",
                "name": "Dressinguri si dulapuri la comanda",
                "serviceType": "Dressinguri la comanda",
                "description": "Dressinguri walk-in si dulapuri cu usi glisante, compartimentare interioara pe masura si iluminat LED integrat.",
                "provider": { "@id": "https://atlantisfurnitures.ro/#business" },
                "areaServed": [
                  { "@type": "City", "name": "Bucuresti" },
                  { "@type": "AdministrativeArea", "name": "Ilfov" }
                ]
              }
            },
            {
              "@type": "Offer",

                "provider": { "@id": "https://atlantisfurnitures.ro/#business" },
                "areaServed": [
                  { "@type": "City", "name": "Bucuresti" },
                  { "@type": "AdministrativeArea", "name": "Ilfov" }
                ]
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {

      {

        "logo": { "@id": "https://atlantisfurnitures.ro/#logo" },
        "image": { "@id": "https://atlantisfurnitures.ro/#logo" },
